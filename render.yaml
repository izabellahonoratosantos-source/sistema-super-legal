services:
  - type: web
    name: sistema-super-legal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      # Assina os tokens de sessão (HMAC). O Render gera um valor aleatório.
      - key: SESSION_SECRET
        generateValue: true
      # Cria 4 reservas de exemplo na primeira execução (remova depois).
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: labescola-db
          property: connectionString

databases:
  - name: labescola-db
    plan: free
    databaseName: labescola
    user: labescola
