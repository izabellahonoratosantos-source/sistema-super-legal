<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão · LabEscola</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f0fdf4;
        color: #14532d;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #dcfce7;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 12px 32px rgba(22, 101, 52, 0.1);
      }
      .icone {
        font-size: 3rem;
        display: block;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        color: #166534;
      }
      p {
        margin: 0 0 20px;
        color: #3f6212;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #16a34a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        border-radius: 8px;
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="icone">📴</span>
      <h1>Você está offline</h1>
      <p>
        O LabEscola guarda os últimos agendamentos consultados no aparelho, mas para criar ou editar reservas é
        preciso estar conectado.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
